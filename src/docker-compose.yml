version: '3.8'

services:
  postgres-db:
    build: . # This tells Docker Compose to build the Dockerfile in the current directory
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: